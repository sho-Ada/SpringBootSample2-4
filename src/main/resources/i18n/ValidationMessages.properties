#========================
#バリデーションエラーメッサージ
#========================
NotBlank={0}は必須入力です 
Email={0}はメールアドレス形式で入力してください
Length={0}は、{2}桁以上、{1}桁以下で入力してください
Pattern={0}は半角英数字で入力してください
NotNull={0}は必須入力です
Min={0}は{1}以上を入力してください
Max={0}は{1}以下を入力してください

#{0}に項目名が入る。{1}には最小値、{2}には最大値が入る。
#POSTでフォームが送られると、Springが SignupForm に値を詰める。ageはInteger型birthdayはDate型。signupFormJavaで@DateTimeFormat("yyyy/MM/dd")としているため、ここで変換できないと、typeMismatch~~~となる。
#その時に使われるのが上にあるtypeMismatchのメッセージ。
#上がOKだった場合NotBlankより下が表示される。