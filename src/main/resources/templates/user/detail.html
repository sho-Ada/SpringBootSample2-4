<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decolate="~{layout/layout}">

<head>
	<title>ユーザー詳細</title>
	<!-- CSS読込 -->
	<link rel="stylesheet" th:href="@{/css/user/list.css}">
</head>

<body>
	<div layout:fragment="content">
		<div class="header border-bottom">
			<h1 class="h2">ユーザー詳細</h1>
		</div>
		<form id="user-detail-form" method="post" th:action="@{/user/detail}" class="form-signup"
			th:object="${userDetailForm}">
			<input type="hidden" th:field="*{userId}" />
			<!-- ユーザー詳細情報 -->
			<table class="table table-striped table-bordered table-hover">
				<tbody>
					<tr>
						<th class="w25">ユーザーID</th><!--見出し-->
						<td th:text="*{userId}"></td><!--userDetailForm.userIdを参照する。-->
					</tr>
					<tr>
						<th>パスワード</th><!--見出し-->
						<td>
							<input type="text" class="form-control" th:field="*{password}" /><!--userDetailForm.passwordを参照する。-->
						</td>
					</tr>
					<tr>
						<th>ユーザー名</th><!--見出し-->
						<td>
							<input type="text" class="form-control" th:field="*{userName}" /><!--送信するとuserNameを参照。-->
						</td>
					</tr>
					<tr>
						<th>誕生日</th>
						<td th:text="*{#dates.format(birthday, 'YYYY/MM/dd')}"></td><!--userDetailForm.birthdayを参照する。-->
					</tr>
					<tr>
						<th>年齢</th>
						<td th:text="*{age}"></td><!--userDetailForm.ageを参照する。-->
					</tr>
					<tr>
						<th>性別</th>
						<td th:text="*{gender == 1 ? '男性' : '女性'}"></td><!--userDetailForm.genderを参照する。-->
					</tr>
					<th>部署名</th>
					<td>
						<span th:if="*{department != null}" th:text="*{department.departmentName}"></span><!--userDetailForm.departmentを参照しnullじゃない時だけ表示する。-->
					</td>
					</tr>
				</tbody>
			</table>
			<!-- ボタンエリア -->
			<div class="text-center">
				<!-- 削除ボタン -->
				<button class="btn btn-danger" type="submit" name="delete">削除</button><!--deleteパラメータをつけてフォーム送信。-->

				<!-- 更新ボタン -->
				<button class="btn btn-primary" type="submit" name="update">更新</button><!--deleteパラメータをつけてフォーム送信。-->

			</div>
			<!-- 給与情報 -->
			<th:block th:if="*{salaryList != null and salaryList.size() > 0}"><!--salaryListがnullではなく、件数が1以上なら、このブロックを表示する。th:blockはタグとしては出力しないけど、条件や繰り返しをかけられる。-->
				<div class="header border-bottom">
					<h1 class="h2">給与</h1>
				</div>
				<table class="table table-striped table-bordered table-hover">
					<thead>
						<tr>
							<th class="w-25">年月</th>
							<th>給料</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="item:*{salaryList}"><!--salaryListを1件ずつ出す。itemがSalary1件分。-->
							<td th:text="${item.yearMonth}"></td><!--itemの日付表示。-->
							<td th:text="${#numbers.formatInteger(item.salary, 3, 'COMMA')}"></td><!--item.salaryを３っつおきに間にコンマを入れて表示-->
						</tr>
					</tbody>
				</table>
			</th:block>
		</form>
	</div>
</body>

</html>
