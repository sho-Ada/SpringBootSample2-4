<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
	<meta charset="UTF-8">
	</meta>
	<meta name="viewport" content="width=device-width,initial-scale=1, shrink-to-fit=no"><!--スマホ表示調整のための設定。-->
	</meta>
	<!-- 共通CSS読込 -->
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/css/layout/layout.css}">
	<!-- 共通JS読込 -->
	<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
	<script th:src="@{/webjars/bootstrap/bootstrap.min.js}"></script>
	<title></title>
</head>

<body>
	<!-- ヘッダー -->
	<nav layout:replace="~{layout/header::header}"></nav><!--layout/headerというテンプレートの中のheaderというフラグメントをここに置く。つまり「毎ページ同じヘッダー」を再利用できる。--><!--もう一度ここ復習する！！-->
	<!-- メニュー -->
	<div class="container-fluid"><!--Bootstrapの全幅コンテナ開始。-->
		<div class="row"><!--行開始-->
			<nav class="col-sm-2 bg-light sidebar pt-2"><!--左サイドバー部分。col-sm-2は画面がsm以上なら横幅2/12（約16.7%）という意味。bg-lightは背景を薄いグレーにする。sidebarはCSS .sidebar{〜} が該当する。pt-2は上に少し余白（padding-topの略）。-->
				<div layout:replace="~{layout/menu::menu}"></div><!--menuHTMLに入っている-->
			</nav>
		</div>
	</div>
	<!-- コンテンツ -->
	<div class="container-fluid"><!--本文用の全幅コンテナ開始。-->
		<div class="row"><!--行開始-->
			<div class="col-sm-10 offset-sm-2 main"><!--横幅10/12。左に2/12分の余白を取る。自分で作ったCSS.main{~~}がはいる。-->
				<div layout:fragment="content"></div><!--差し替えポイント。各ページ側がlayout:fragment="content"に対応する内容を提供して、ここに埋め込まれる。--><!--ここよくわからなかったから復習する！！！-->
			</div>
		</div>
	</div>
</body>

</html>
