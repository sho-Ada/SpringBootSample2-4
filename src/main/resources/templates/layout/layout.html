<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
	<meta charset="UTF-8">
	</meta>
	<meta name="viewpoint" content="width=device-with,initial-scale=1, shrink-to-fit=no">
	</meta>
	<!-- 共通CSS読込 -->
	<link rel="stylesheet" href="@{/webjars/bootstrap/css/bootstrap.min.css}">
	<link rel="stylesheet" href="@{/css/layout/layout.css}">
	<!-- 共通JS読込 -->
	<script src="@{/webjar/jquery/jquery.min.js}"></script>
	<script src="@{/webjar/bootstrap/bootstrap.min.js}"></script>
	<title></title>
</head>

<body>
	<!-- ヘッダー -->
	<nav layout:replace="~{layout/header::header}"></nav>
	<!-- メニュー -->
	<div class="container-fluid">
		<div class="row">
			<nav class="col-sm-2 bg-light sidebar pt-2">
				<div layout:replace="~{layout/menu::menu}"></div>
			</nav>
		</div>
	</div>
	<!-- コンテンツ -->
	<div class="container-fluid">
		<div class="row">
			<div class="col-sm-10 offset-sm-2 main">
				<div layout:fragment="content"></div>
			</div>
		</div>
	</div>
</body>

</html>
